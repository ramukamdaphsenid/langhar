services:
  langhar:
    command:
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app
    volumes:
      - ./backend/api.py:/app/api.py:ro
      - ./backend/src:/app/src:ro
      - ./backend/config/settings.py:/app/config/settings.py:ro

  frontend:
    image: node:22-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - npm ci --no-audit --no-fund && npm start -- --host 0.0.0.0 --poll 1000 --proxy-config proxy.docker.conf.json
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - langhar

volumes:
  frontend_node_modules:
